# Hardening profiles configuration
# Format: PROFILE_NAME="function1 function2 function3"

# Recommended profile - balanced security
# Ordering note: remote-access and sharing services are disabled BEFORE the
# firewall is enabled. Enabling the firewall while Remote Apple Events / Remote
# Application Scripting is on triggers the macOS "Blocked by Firewall" conflict,
# so those services must be turned off first.
PROFILE_RECOMMENDED="
    update_system
    disable_remote_apple_events
    disable_internet_sharing
    disable_printer_sharing
    enable_firewall
    enable_gatekeeper
    configure_screensaver
    disable_automatic_login
    require_password_wake
    disable_guest_account
    show_filename_extensions
    disable_safari_safe_files
    enable_filevault
    enable_security_auditing
    configure_time_sync
    disable_bonjour
    secure_home_folders
    configure_password_policy
    configure_keychain_lock
    enable_certificate_checking
    disable_root_account
    configure_hibernate_mode
    set_login_message
    disable_password_hints
    disable_guest_shared_folders
    disable_siri_dictation
    disable_diagnostics
    secure_safari
"

# Paranoid profile - maximum restrictions
# Ordering note: every remote-access and sharing service is disabled BEFORE the
# firewall (and block-all) is enabled, so macOS never raises the "Blocked by
# Firewall" conflict on Remote Apple Events / Remote Application Scripting.
PROFILE_PARANOID="
    update_system
    disable_remote_apple_events
    disable_internet_sharing
    disable_printer_sharing
    disable_screen_sharing
    disable_file_sharing
    disable_remote_management
    disable_remote_login
    enable_firewall
    enable_firewall_block_all
    enable_gatekeeper
    configure_screensaver
    disable_automatic_login
    require_password_wake
    disable_guest_account
    show_filename_extensions
    disable_safari_safe_files
    enable_filevault
    enable_security_auditing
    configure_time_sync
    disable_bonjour
    secure_home_folders
    configure_password_policy
    configure_keychain_lock
    enable_certificate_checking
    disable_root_account
    configure_hibernate_mode
    set_login_message
    disable_password_hints
    disable_guest_shared_folders
    disable_siri_dictation
    disable_diagnostics
    secure_safari
    disable_wake_on_lan
    configure_audit_flags
    configure_audit_retention
    disable_airdrop
    disable_http_server
    disable_nfs_server
    check_application_permissions
    fix_system_permissions
    fix_library_permissions
    configure_sudo_timeout
    configure_keychain_sleep_lock
    require_admin_system_prefs
    disable_fast_user_switching
    secure_keychains
    configure_login_window_style
    remove_guest_home
    disable_location_services
    disable_spotlight_suggestions
    disable_unnecessary_daemons
    configure_privacy_settings
    enhance_logging
    disable_ipv6_on_interfaces
    disable_bluetooth_completely
    disable_all_bluetooth_services
    secure_keyboard_settings
    disable_wifi
    harden_kernel
"

# Paranoid MDM coverage notes:
# profile_generator.sh provides persistent MDM enforcement for profile-capable
# paranoid controls such as password policy, screen lock, FileVault, firewall,
# Gatekeeper, updates, login restrictions, SSH, remote access, sharing, Safari,
# DNS, diagnostics submission, Spotlight Internet results, dictation, assistant,
# AirDrop, Handoff, iCloud sync restrictions, and Bluetooth settings changes.
#
# The controls below still require the shell profile because they modify local
# files, services, NVRAM, network interfaces, permissions, audit configuration,
# keychains, or other runtime state that is not fully represented by this MDM
# generator. Use the paranoid shell profile together with the paranoid MDM
# profile for full coverage.
PROFILE_PARANOID_SHELL_REQUIRED="
    enable_security_auditing
    configure_time_sync
    disable_bonjour
    secure_home_folders
    configure_keychain_lock
    enable_certificate_checking
    disable_root_account
    configure_hibernate_mode
    set_login_message
    configure_audit_flags
    configure_audit_retention
    check_application_permissions
    fix_system_permissions
    fix_library_permissions
    configure_sudo_timeout
    configure_keychain_sleep_lock
    require_admin_system_prefs
    secure_keychains
    remove_guest_home
    disable_location_services
    disable_unnecessary_daemons
    enhance_logging
    disable_ipv6_on_interfaces
    disable_bluetooth_completely
    disable_all_bluetooth_services
    secure_keyboard_settings
    disable_wifi
    harden_kernel
"
